 box-shadow:0 18px 44px rgba(14,80,90,.35);display:flex;flex-direction:column;justify-content:center}
.card::before{content:"☕";display:block;font-size:46px;margin-bottom:8px}
.card::after{content:"🌊 🌊 🌊";display:block;margin-top:26px;font-size:22px}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:30px;line-height:1.15;margin:0 0 26px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
p{font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.5);margin:0 0 18px}
button{font:600 18px system-ui,Arial,sans-serif;padding:14px 28px;border:0;border-radius:999px;cursor:pointer;margin:6px;transition:transform .15s}
button:hover{transform:scale(1.07)}
#btn_yes,.main{background:#8b5a3c;color:#fff6e8;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#btn_no{background:#f1e4cc;color:#8a7452;transition:left .25s,top .25s}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;margin-bottom:18px}
.row label{flex:1;font-size:13px;text-align:left;text-shadow:0 1px 6px rgba(0,0,0,.6)}
input{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:0;font:inherit;color:#333;background:#fffaf0}
.note{background:rgba(255,250,240,.92);color:#3b2d24;border-radius:18px;padding:18px;text-align:left;font-family:Georgia,serif;line-height:1.5;margin-bottom:16px;text-shadow:none}
.falling{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(115vh)}}
@media (prefers-reduced-motion:reduce){.falling{display:none}#btn_no{transition:none}}
</style>
</head>
<body>
<div class="card" id="card">

  <div id="screen1">
    <h1 id="text_1">How about we grab a coffee and go for a walk by the sea?</h1>
    <button id="btn_yes">YES</button>
    <button id="btn_no">NO</button>
  </div>

  <div id="screen2" hidden>
    <h1>Yay! Let's make it happen</h1>
    <div class="row">
      <label>Which day?<input type="date" id="day"></label>
      <label>What time?<input type="time" id="time" value="17:00"></label>
    </div>
    <button class="main" id="confirm">Confirm</button>
  </div>

  <div id="screen3" hidden>
    <h1>It's a plan ☕🌊</h1>
    <div class="note" id="note"></div>
    <button class="main" id="share">Send via WhatsApp</button>
    <button class="main" id="tg">Send via Telegram</button>
  </div>

</div>
<script>
// ---- Customize ----
const FROM = "Me";            // your name, shown at the end of the note
const MY_PHONE = "821039351881";          // optional: your WhatsApp number, digits only, e.g. "821012345678"
// -------------------
const $ = id => document.getElementById(id);
const card = $("card"), noBtn = $("btn_no");

function rain(){
  const s=["☕","🌊"];
  for(let i=0;i<30;i++){
    const d=document.createElement("span");
    d.textContent=s[i%2]; d.className="falling";
    d.style.left=Math.random()*95+"vw";
    d.style.animationDelay=Math.random()*1.5+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),5000);
  }
}
function go(from,to){ $(from).hidden=true; $(to).hidden=false; }

// NO runs away
let dodges=0;
const lines=["How about we grab a coffee and go for a walk by the sea?","Are you sure? 🥺","The NO button is running away 😅","Come on, just say YES!"];
function runAway(){
  dodges++;
  $("text_1").textContent=lines[Math.min(dodges,lines.length-1)];
  noBtn.style.position="absolute";
  noBtn.style.left=Math.random()*(card.clientWidth-noBtn.offsetWidth)+"px";
  noBtn.style.top=Math.random()*(card.clientHeight-noBtn.offsetHeight)+"px";
}
noBtn.addEventListener("mouseenter",runAway);
noBtn.addEventListener("touchstart",e=>{e.preventDefault();runAway();},{passive:false});
noBtn.addEventListener("click",e=>{e.preventDefault();runAway();});

$("btn_yes").addEventListener("click",()=>{go("screen1","screen2");rain();});

const dt=new Date(); dt.setDate(dt.getDate()+3);
$("day").value=dt.toISOString().slice(0,10);

let summary="";
$("confirm").addEventListener("click",()=>{
  const day=new Date($("day").value+"T00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const time=$("time").value;
  $("note").innerHTML="<p style='color:inherit;text-shadow:none'>Deal! ☕</p><p style='color:inherit;text-shadow:none'>Coffee first, then a walk by the sea.<br><b>"+day+" at "+time+"</b></p><p style='color:inherit;text-shadow:none;margin:0'>See you there! — "+FROM+"</p>";
  summary="I'm in! ☕🌊 Coffee and a walk by the sea — "+day+" at "+time;
  go("screen2","screen3"); rain();
});

$("tg").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText(summary); $("tg").textContent="Copied — paste it in the chat ✓"; }catch(e){}
  window.open("https://t.me/+"+MY_PHONE,"_blank");
});

$("share").addEventListener("click",async()=>{
  try{
    if(MY_PHONE){ window.open("https://wa.me/"+MY_PHONE+"?text="+encodeURIComponent(summary),"_blank"); }
    else if(navigator.share){ await navigator.share({text:summary}); }
    else { await navigator.clipboard.writeText(summary); $("share").textContent="Copied ✓"; }
  }catch(e){}
});
</script>
</body>
</html>
